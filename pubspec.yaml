name: flow_note
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_carousel_widget: ^3.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_sign_in: ^6.3.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  firebase_auth: ^5.5.2
  firebase_core: ^3.13.0
  hive_flutter: ^1.1.0
  cloud_firestore: ^5.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-VariableFont_wght.ttf
